<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>历史统计 - 双目体重估计</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root{
      --bg0:#0b1220;
      --bg1:#0f1b33;
      --stroke: rgba(255,255,255,.12);
      --text:#e8eefc;
      --muted: rgba(232,238,252,.68);
      --brand:#7c5cff;
      --radius: 18px;
      --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family:var(--sans); color:var(--text);
      background: radial-gradient(1200px 800px at 15% 10%, rgba(124,92,255,.35), transparent 60%),
        radial-gradient(900px 600px at 85% 30%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh; padding:20px;
    }
    .wrap{ max-width:1200px; margin:0 auto; }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      padding:14px 16px; border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius: var(--radius); margin-bottom:20px;
    }
    .topbar-nav{ display:flex; align-items:center; gap:10px; }
    .topbar-right{ display:flex; align-items:center; gap:12px; margin-left:12px; padding-left:12px; border-left:1px solid var(--stroke); }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 16px; border-radius:999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.08);
      color:var(--text);
      font-size:13px;
      transition:.15s ease;
      text-decoration:none;
    }
    a.pill:hover{ background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); transform: translateY(-1px); }
    .pill.active{ background: rgba(124,92,255,.25); border-color: var(--brand); color:#fff; }
    .pill.user-pill{ background: rgba(255,255,255,.06); color:var(--muted); font-size:12px; padding:8px 12px; }
    a.pill{ color:inherit; }
    .btn{ appearance:none; padding:10px 12px; border-radius:12px; border:1px solid var(--stroke); background:rgba(255,255,255,.08); color:var(--text); cursor:pointer; font-size:13px; font-weight:600; transition:.15s ease; }
    .btn:hover{ background:rgba(255,255,255,.12); transform: translateY(-1px); }
    .card{ border:1px solid var(--stroke); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)); border-radius: var(--radius); padding:20px; margin-bottom:20px; }
    .card h2{ margin:0 0 12px; font-size:16px; }
    .filters{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
    .filters label{ font-size:12px; color:var(--muted); margin-right:4px; }
    .filters input, .filters select{ padding:6px 10px; border-radius:8px; border:1px solid var(--stroke); background:rgba(255,255,255,.06); color:var(--text); }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ padding:10px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); }
    th{ color:var(--muted); font-weight:600; }
    #chart{ width:100%; height:400px; }
    .footer{ margin-top:16px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:0;">
        <nav class="topbar-nav">
          <a href="/app" class="pill">估重</a>
          <a href="/history" class="pill active">历史统计</a>
          <a href="/pools-page" class="pill">鱼池管理</a>
        </nav>
        <div class="topbar-right">
          <span class="pill user-pill">用户: <span id="userName">—</span></span>
          <button class="btn" id="btnLogout">退出</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>估重日期 vs 估重重量（按鱼池）</h2>
      <div id="chart"></div>
      <div class="filters" style="margin-top:12px;">
        <label>时间范围</label>
        <input type="date" id="chartStart" />
        <span>至</span>
        <input type="date" id="chartEnd" />
        <button class="btn" id="btnRefreshChart">刷新图表</button>
      </div>
    </div>

    <div class="card">
      <h2>历史记录</h2>
      <div class="filters">
        <label>状态</label>
        <select id="filterStatus">
          <option value="">全部</option>
          <option value="queued">排队</option>
          <option value="running">运行中</option>
          <option value="done">完成</option>
          <option value="failed">失败</option>
        </select>
        <label>鱼池</label>
        <select id="filterPool">
          <option value="">全部</option>
        </select>
        <label>开始日期</label>
        <input type="date" id="filterStart" />
        <label>结束日期</label>
        <input type="date" id="filterEnd" />
        <button class="btn" id="btnLoad">查询</button>
      </div>
      <div class="filters" style="margin-bottom:12px; padding:12px; border:1px solid var(--stroke); border-radius:12px; background:rgba(0,0,0,.1);">
        <b style="font-size:13px;">清空历史</b>
        <label>按鱼池</label>
        <select id="clearPool"><option value="">选择鱼池</option></select>
        <button class="btn" id="btnClearPool">清空该鱼池</button>
        <label>按日期</label>
        <input type="date" id="clearStart" />
        <span>至</span>
        <input type="date" id="clearEnd" />
        <button class="btn" id="btnClearRange">清空该时间段</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>任务ID</th>
            <th>鱼池</th>
            <th>创建时间</th>
            <th>状态</th>
            <th>耗时(s)</th>
            <th>估重(g)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="filters" style="margin-top:12px;">
        <span class="pill" id="totalText">共 0 条</span>
        <button class="btn" id="btnPrev">上一页</button>
        <span class="pill" id="pageText">第 1 页</span>
        <button class="btn" id="btnNext">下一页</button>
      </div>
      <div class="footer">© Stereo Weight Estimation - 历史统计</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    if (!localStorage.getItem("token")) { window.location.href = "/"; }
    $("userName").textContent = localStorage.getItem("username") || "—";
    $("btnLogout").onclick = () => { localStorage.removeItem("token"); localStorage.removeItem("username"); localStorage.removeItem("role"); window.location.href = "/"; };

    function authHeaders() { return { "Authorization": "Bearer " + (localStorage.getItem("token") || "") }; }
    function check401(r) { if (r && r.status === 401) { localStorage.removeItem("token"); window.location.href = "/"; return true; } return false; }

    let page = 1, limit = 20, totalCount = 0;

    function dateStr(ts) {
      if (ts == null) return "—";
      const d = new Date(ts * 1000);
      return d.toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    async function loadList() {
      const status = $("filterStatus").value || undefined;
      const pool_name = $("filterPool").value || undefined;
      const start_date = $("filterStart").value || undefined;
      const end_date = $("filterEnd").value || undefined;
      const params = new URLSearchParams({ page: String(page), limit: String(limit) });
      if (status) params.set("status", status);
      if (pool_name) params.set("pool_name", pool_name);
      if (start_date) params.set("start_date", start_date);
      if (end_date) params.set("end_date", end_date);
      const r = await fetch("/history/list?" + params.toString(), { headers: authHeaders() });
      if (check401(r)) return;
      const data = await r.json();
      totalCount = data.total || 0;
      const items = data.items || [];
      const tbody = $("tbody");
      tbody.innerHTML = items.map(j => {
        const res = j.result;
        const weight = (res && res.ok && res.avg_weight_g != null) ? Number(res.avg_weight_g).toFixed(2) : "—";
        const jid = (j.job_id || "");
        return `<tr>
          <td>${jid.slice(0,8)}…</td>
          <td>${j.pool_name || "—"}</td>
          <td>${dateStr(j.created_at)}</td>
          <td>${j.status || "—"}</td>
          <td>${j.elapsed_sec != null ? j.elapsed_sec : "—"}</td>
          <td>${weight}</td>
          <td><button class="btn" data-job-id="${jid}" type="button">删除</button></td>
        </tr>`;
      }).join("");
      tbody.querySelectorAll("button[data-job-id]").forEach(btn => {
        btn.onclick = () => deleteHistory({ job_id: btn.getAttribute("data-job-id") });
      });
      $("totalText").textContent = "共 " + totalCount + " 条";
      $("pageText").textContent = "第 " + page + " 页";
      $("btnPrev").disabled = page <= 1;
      $("btnNext").disabled = page * limit >= totalCount;
    }

    async function loadChart() {
      const start_date = $("chartStart").value || undefined;
      const end_date = $("chartEnd").value || undefined;
      const params = new URLSearchParams();
      if (start_date) params.set("start_date", start_date);
      if (end_date) params.set("end_date", end_date);
      const r = await fetch("/history/chart?" + params.toString(), { headers: authHeaders() });
      if (check401(r)) return;
      const byPool = await r.json();
      const chartDom = document.getElementById("chart");
      const chart = echarts.init(chartDom);
      const series = [];
      const colors = ["#7c5cff", "#22c55e", "#3b82f6", "#f59e0b", "#ef4444"];
      let idx = 0;
      for (const [poolName, points] of Object.entries(byPool)) {
        if (!Array.isArray(points) || points.length === 0) continue;
        const sorted = [...points].sort((a, b) => a.date.localeCompare(b.date));
        series.push({
          name: poolName,
          type: "line",
          data: sorted.map(p => [p.date, p.weight_g]),
          smooth: true,
          itemStyle: { color: colors[idx % colors.length] },
        });
        idx++;
      }
      chart.setOption({
        tooltip: { trigger: "axis" },
        legend: { data: series.map(s => s.name), bottom: 0 },
        grid: { left: "3%", right: "4%", bottom: "15%", top: "10%", containLabel: true },
        xAxis: { type: "time", name: "估重日期" },
        yAxis: { type: "value", name: "估重重量(g)" },
        series: series.length ? series : [{ name: "无数据", type: "line", data: [] }],
      });
    }

    async function loadPools() {
      try {
        const r = await fetch("/pools", { headers: authHeaders() });
        if (check401(r)) return;
        const list = await r.json();
        const sel = $("filterPool");
        const selClear = $("clearPool");
        sel.innerHTML = "<option value=\"\">全部</option>";
        selClear.innerHTML = "<option value=\"\">选择鱼池</option>";
        list.forEach(p => {
          const o = document.createElement("option"); o.value = p.name; o.textContent = p.name; sel.appendChild(o);
          const o2 = document.createElement("option"); o2.value = p.name; o2.textContent = p.name; selClear.appendChild(o2);
        });
      } catch (e) {}
    }

    async function deleteHistory(params) {
      const q = new URLSearchParams(params);
      const r = await fetch("/history?" + q.toString(), { method: "DELETE", headers: authHeaders() });
      if (check401(r)) return;
      const data = await r.json().catch(() => ({}));
      if (data.deleted != null) { alert("已删除 " + data.deleted + " 条"); loadList(); loadChart(); }
      else alert(data.detail || "删除失败");
    }

    $("btnLoad").onclick = loadList;
    $("btnRefreshChart").onclick = loadChart;
    $("btnPrev").onclick = () => { if (page > 1) { page--; loadList(); } };
    $("btnNext").onclick = () => { if (page * limit < totalCount) { page++; loadList(); } };
    $("btnClearPool").onclick = () => {
      const pool = $("clearPool").value;
      if (!pool) { alert("请选择鱼池"); return; }
      if (!confirm("确定清空该鱼池的全部历史？")) return;
      deleteHistory({ pool_name: pool });
    };
    $("btnClearRange").onclick = () => {
      const start = $("clearStart").value;
      const end = $("clearEnd").value;
      if (!start || !end) { alert("请选择开始和结束日期"); return; }
      if (!confirm("确定清空该时间段的全部历史？")) return;
      deleteHistory({ start_date: start, end_date: end });
    };

    loadPools();
    loadList();
    loadChart();
  </script>
</body>
</html>
